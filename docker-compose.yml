services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inference}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-inference_engine}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - inference-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inference} -d ${POSTGRES_DB:-inference_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"${REDIS_PASSWORD:-}\""]
    ports:
      - "6379:6379"
    networks:
      - inference-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    build: .
    image: inference-engine:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inference}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inference_engine}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    volumes:
      - ./models:/app/models
    networks:
      - inference-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-4g}

  worker:
    image: inference-engine:latest
    command: ["arq", "app.infra.queue.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inference}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inference_engine}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    volumes:
      - ./models:/app/models
    networks:
      - inference-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  # ── Observability (optional — use --profile observability) ──────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - inference-net
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - inference-net
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:

networks:
  inference-net:
