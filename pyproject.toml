[project]
name = "inference-engine"
version = "0.1.0"
description = "Production-grade, task-agnostic ML inference backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "prometheus-client==0.23.1",
    "pydantic==2.12.5",
    "uvicorn==0.40.0",
    "redis==5.3.1",
    "arq==0.28.0",
    "python-dotenv==1.2.2",
    "asyncpg>=0.31.0",
    "groq>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pytest-cov>=5.0",
    "scikit-learn>=1.4.0",
    "category-encoders>=2.9.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]
postgres = [
    "psycopg2-binary>=2.9",
]
cli = [
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "groq>=0.9.0",
]

[project.scripts]
inference-engine = "app.cli.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
