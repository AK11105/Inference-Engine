name: Docker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inference-engine:ci .

      - name: Start container
        run: |
          docker run -d --name ie -p 8000:8000 \
            -e API_KEYS="ci-key:tenant_ci:predict,read_models" \
            inference-engine:ci

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Container failed to become healthy" >&2
          docker logs ie
          exit 1

      - name: Smoke test GET /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; exit 1; }

      - name: Smoke test POST /predict echo model
        run: |
          RESULT=$(curl -sf -X POST http://localhost:8000/predict \
            -H "X-API-Key: ci-key" \
            -H "Content-Type: application/json" \
            -d '{"model":"echo","version":"v1","data":"ci-smoke"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
          [ "$RESULT" = "ci-smoke" ] || { echo "Expected 'ci-smoke', got '$RESULT'"; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm -f ie

  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inference-engine:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inference-engine:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy-report.txt

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
