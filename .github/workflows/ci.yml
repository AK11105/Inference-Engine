name: CI
on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --extra dev --extra cli --extra torch --extra onnx --extra safetensors --extra frameworks
      - name: Run pytest
        env:
          SQLITE_DB_PATH: ":memory:"
          LOG_DB_PATH: ":memory:"
        run: uv run pytest
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Audit dependencies
        run: |
          uv export --no-dev --no-emit-project -o /tmp/requirements.txt
          # PYSEC-2025-183 (CVE-2025-45768): disputed advisory on pyjwt (transitive via redis).
          # No fix version exists; the issue is caller misuse of weak keys, not a library bug.
          # Reviewed 2026-05-20. Revisit if a patched pyjwt release is published.
          uv run --with pip-audit pip-audit -S -r /tmp/requirements.txt --ignore-vuln PYSEC-2025-183