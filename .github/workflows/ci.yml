name: CI
on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --extra dev --extra cli
      - name: Run pytest
        env:
          SQLITE_DB_PATH: ":memory:"
        run: uv run pytest
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Audit dependencies
        run: |
          uv export --no-dev --no-emit-project -o /tmp/requirements.txt
          uv run --with pip-audit pip-audit -S -r /tmp/requirements.txt