# docker-compose.override.yml — dev overrides (auto-loaded by `docker compose up`)
# Adds hot-reload, source bind-mount, and relaxed env for local development.
services:

  api:
    command:
      - uvicorn
      - app.adapters.http.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      ENV: development
    volumes:
      - ./app:/app/app   # live-reload source changes without rebuild

  worker:
    environment:
      ENV: development
    volumes:
      - ./app:/app/app
